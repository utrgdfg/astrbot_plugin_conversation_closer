name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: "质量检查（Python ${{ matrix.python-version }}）"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装开发依赖
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: 编译 Python 源码
        run: python -m compileall -q .

      - name: Ruff 代码检查
        run: ruff check .

      - name: 运行测试
        run: pytest

      - name: Bandit 安全检查
        run: bandit -q -r . -x ./tests

  astrbot-api-contract:
    name: "AstrBot 接口契约（${{ matrix.astrbot-ref }}）"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot-ref: ["v4.24.2", "master"]

    steps:
      - name: 检出插件
        uses: actions/checkout@v4

      - name: 检出 AstrBot 源码
        uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: ${{ matrix.astrbot-ref }}
          path: .astrbot-source

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 验证 AstrBot 接口源码契约
        run: python scripts/check_astrbot_api.py .astrbot-source
