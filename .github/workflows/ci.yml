name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Bandit
        run: bandit -q -r . -x ./tests

  astrbot-api-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astrbot-ref: ["v4.24.2", "master"]

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Check out AstrBot source
        uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: ${{ matrix.astrbot-ref }}
          path: .astrbot-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify AstrBot API source contract
        run: python scripts/check_astrbot_api.py .astrbot-source
